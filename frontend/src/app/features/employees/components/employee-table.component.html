<table class="table table-striped table-hover align-middle">
  <thead>
    <tr>
      <th scope="col">Nombre</th>
      <th scope="col">Cargo</th>
      <th scope="col">Departamento</th>
      <th scope="col">Sueldo</th>
      <th scope="col" class="text-end">Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (employee of employees; track trackById($index, employee)) {
      <tr>
        <td>{{ employee.nombre }}</td>
        <td>{{ employee.cargo }}</td>
        <td>{{ employee.departamento }}</td>
        <td>{{ employee.sueldo | currency: 'USD' }}</td>
        <td class="text-end">
          <button
            type="button"
            class="btn btn-sm btn-outline-primary me-2"
            (click)="onEdit(employee)"
          >
            Editar
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="onRemove(employee.id)"
          >
            Eliminar
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="text-center text-muted">No hay empleados registrados.</td>
      </tr>
    }
  </tbody>
</table>
